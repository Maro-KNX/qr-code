<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marco</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 30px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.20);
        }

        h1 {
            margin: 0 0 35px;
            color: #b00000;
            font-size: 48px;
        }

        .spruch {
            margin-bottom: 35px;
            font-size: 32px;
            font-weight: bold;
            line-height: 1.5;
        }

        img {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 30px auto 0;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.25);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 38px;
            }

            .spruch {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Marco</h1>

        <div class="spruch">
            Wotsch Föttli oder was luegsch so?
            <br><br>
            Du huerre Banane!!
            <br><br>
            Meinsch bisch cool, will Bändeli ah hesch!
        </div>

        <img src="Marco.png" alt="Marco">

    </div>

</body>
</html>
