<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trailerpark-Shooters</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 30px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.20);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 35px;
            color: #b00000;
            font-size: 48px;
        }

        .angebot {
            font-size: 30px;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .preis {
            color: #b00000;
            font-size: 42px;
            font-weight: bold;
        }

        .warnung {
            color: #111111;
            font-size: 30px;
            font-weight: bold;
        }

        .versprochen {
            display: block;
            margin-top: 12px;
            color: #b00000;
            font-size: 34px;
            font-weight: bold;
        }

        img {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 30px auto 0;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 10px auto;
                padding: 20px;
            }

            h1 {
                font-size: 34px;
            }

            .angebot,
            .warnung {
                font-size: 23px;
            }

            .preis {
                font-size: 32px;
            }

            .versprochen {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Trailerpark-Shooters</h1>

        <div class="angebot">
            Kippflinte – Aktion bei Walmart
            <br>

            <span class="preis">
                !! Nur 6,66 $ !!
            </span>

            <br>

            <span class="warnung">
                Komm mir blöd und du lernst sie von Nahem kennen 😊
            </span>

            <span class="versprochen">
                Versprochen!
            </span>
        </div>

        <img
            src="Trailerpark-Shooters.png"
            alt="Trailerpark-Shooters"
        >

    </div>

</body>
</html>
